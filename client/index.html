    <script>
      // Early error detection for older browsers
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="padding:20px;background:red;color:white;font-size:16px;">' +
          '<h2>Error Loading App</h2>' +
          '<p>' + msg + '</p>' +
          '<p>File: ' + url + '</p>' +
          '<p>Line: ' + line + '</p>' +
          '</div>';
        return true;
      };
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding:20px;text-align:center;">
          <h2>JavaScript Required</h2>
          <p>Please enable JavaScript to use this app.</p>
        </div>
      </noscript>
      <div id="loading-fallback" style="padding:40px;text-align:center;font-family:sans-serif;">
        <p>Loading University Planner...</p>
        <p style="font-size:12px;color:#666;margin-top:20px;">If this message stays for more than 10 seconds, your browser may not be supported.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script nomodule>
      // Fallback for browsers that don't support ES modules
      document.getElementById('loading-fallback').innerHTML = 
        '<div style="padding:20px;background:#ff6600;color:white;">' +
        '<h2>Browser Not Supported</h2>' +
        '<p>Your browser does not support modern JavaScript modules.</p>' +
        '<p>Please update your device or try a different browser.</p>' +
        '</div>';
    </script>
  </body>
</html>
